<!DOCTYPE html>
<html>
<head>
    <title>Profile Settings</title>
    <style>
        .flash-msg {
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 4px; 
            color: white; 
            text-align: center; 
            font-weight: bold;
        }
        .flash-success {
            background-color: #10b981;
        }
        .flash-error {
            background-color: #ef4444; 
        }
    </style>
</head>
<body style="font-family: Arial; padding: 40px; max-width: 400px; margin: 0 auto;">
    <h2>Profile Settings</h2>
    <p>Logged in as: <strong>{{ user }}</strong> | <a href="/logout">Logout</a></p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-msg flash-{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div style="background: #f4f7f6; padding: 20px; border-radius: 8px;">
        <form method="POST" action="/update-email">
            <!-- TODO: Add CSRF token input field -->
             
            <label>Current Email Address:</label><br>
            <input type="email" name="email" value="{{ current_email }}" required style="width: 100%; margin: 10px 0;"><br>
            
            <button type="submit" style="padding: 10px; width: 100%; background: #3b82f6; color: white; border: none;">Update Email</button>
        </form>
    </div>
</body>
</html>
